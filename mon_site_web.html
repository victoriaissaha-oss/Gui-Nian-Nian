<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon site web</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: white;
      color: #2575fc;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #e0e0e0;
    }

    section {
      padding: 40px 20px;
      background: rgba(0,0,0,0.2);
      margin: 20px;
      border-radius: 15px;
    }

    footer {
      padding: 20px;
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenue sur mon site</h1>
    <p>Un site simple créé pour toi 🚀</p>
    <a class="btn" href="#about">En savoir plus</a>
  </header>

  <section id="about">
    <h2>À propos</h2>
    <p>Ce site est un exemple de page web moderne avec HTML et CSS.</p>
  </section>

  <section>
    <h2>Mes services</h2>
    <p>💡 Design simple<br>🎨 Création de sites<br>⚡ Rapide et responsive</p>
  </section>

  <footer>
    © 2026 Mon site web - Tous droits réservés
  </footer>

</body>
</html>
